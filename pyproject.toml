[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-cohort-analytics"
version = "0.1.0"
description = "SQL-first cohort, retention, and RFM analysis of the UCI Online Retail II transactions"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
retail-analytics = "retail_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_analytics = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
